# =============================================================
# .github/workflows/deploy-database.yml
# Repository: insurance-database
#
# TRIGGER  : push to  branch (developer commits a migration)
# DOES     : spins up MySQL, runs Flyway migrations, validates
# ON SUCCESS: fires repository_dispatch → insurance-api repo
#
# Secrets needed in this repo's Settings → Secrets:
#   CROSS_REPO_TOKEN  — GitHub PAT with repo scope (to dispatch)
#   DB_PASSWORD       — production database password
# =============================================================

name: Deploy Database

on:
  push:
    branches: [master]

jobs:
  # ── Job 1: Run Flyway migrations ─────────────────────────────
  migrate:
    name: Run Flyway Migrations
    runs-on: ubuntu-latest

    # Spin up a real MySQL container as a service — Flyway talks to it
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: insurance_db
        ports:
          - 3306:3306
        # Wait until MySQL is actually ready before running steps
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      # ── Checkout source ──────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Flyway CLI (community edition, free) ─────────────────
      # Downloads flyway-commandline and caches it between runs
      - name: Cache Flyway CLI
        uses: actions/cache@v4
        with:
          path: ~/flyway
          key: flyway-10.10.0

      - name: Install Flyway CLI
        run: |
          if [ ! -f ~/flyway/flyway ]; then
            mkdir -p ~/flyway
            curl -sL https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/10.10.0/flyway-commandline-10.10.0-linux-x64.tar.gz \
              | tar -xz --strip-components=1 -C ~/flyway
          fi
          echo "$HOME/flyway" >> $GITHUB_PATH

      # ── Run migrations ───────────────────────────────────────
      - name: Run Flyway migrations
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/insurance_db
          DB_USER: root
          DB_PASS: rootpassword           # use ${{ secrets.DB_PASSWORD }} in prod
        run: |
          flyway \
            -url="$DB_URL" \
            -user="$DB_USER" \
            -password="$DB_PASS" \
            -locations="filesystem:./migrations" \
            migrate

      # ── Validate schema + seed data ──────────────────────────
      - name: Validate database
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_NAME: insurance_db
          DB_USER: root
          DB_PASS: rootpassword
        run: bash scripts/validate-db.sh

      # ── Post migration summary ───────────────────────────────
      - name: Show migration history
        run: |
          flyway \
            -url="jdbc:mysql://127.0.0.1:3306/insurance_db" \
            -user=root \
            -password=rootpassword \
            info

  # ── Job 2: Trigger backend deployment ───────────────────────
  # Only runs when the migrate job succeeds
  dispatch-backend:
    name: Trigger Backend Deployment
    runs-on: ubuntu-latest
    needs: migrate            # explicit dependency — won't run if migrate fails

    steps:
      # ── Fire repository_dispatch to insurance-api ─────────────
      # The backend workflow listens for the "database_deployed" event type.
      # client_payload carries metadata the backend can log/display.
      - name: Dispatch event to insurance-api
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CROSS_REPO_TOKEN }}   # PAT with repo scope
          repository: ${{ github.repository_owner }}/insurance-api
          event-type: database_deployed
          client-payload: |
            {
              "db_sha":        "${{ github.sha }}",
              "db_branch":     "${{ github.ref_name }}",
              "db_actor":      "${{ github.actor }}",
              "db_run_id":     "${{ github.run_id }}",
              "db_repo":       "${{ github.repository }}",
              "timestamp":     "${{ github.event.head_commit.timestamp }}"
            }

      - name: Log dispatch confirmation
        run: |
          echo "✅ database_deployed event sent to insurance-api"
          echo "   DB SHA    : ${{ github.sha }}"
          echo "   Triggered by: ${{ github.actor }}"
